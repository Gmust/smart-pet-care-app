appId: com.misopets.app
# Opens the PET_NAME pet's profile from the Pets tab. The tab shows a profile (the first pet by
# default), so the pet is picked from the switcher chip; "Select <name>" is a row of its drawer.
# Assumes list mode is off, which is the default.
---
- tapOn: "Pets"
- extendedWaitUntil:
    visible: "Selected pet: .*"
    timeout: 15000
- tapOn: "Selected pet: .*"
- extendedWaitUntil:
    visible: "Select ${PET_NAME}"
    timeout: 5000
- tapOn: "Select ${PET_NAME}"
- extendedWaitUntil:
    visible: "Overview"
    timeout: 15000
