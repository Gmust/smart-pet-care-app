appId: com.misopets.app
name: FR-21 Password reset request (signed out)
env:
  # RFC 2606 reserved domain: no real mailbox, and no account to reset.
  RESET_EMAIL: maestro-evidence@example.com
# LEAVES THE APP SIGNED OUT. Runs last (see config.yaml): if a session is live it
# signs out first through Profile > Sign out. Sign back in by hand afterwards.
# Requests a reset link only; no reset is completed. `?` is escaped (regex).
---
- launchApp
- extendedWaitUntil:
    visible: "(Activity|Because caring is a lot to remember)"
    timeout: 20000
- runFlow:
    when:
      notVisible: "Because caring is a lot to remember"
    commands:
      - tapOn: "Profile"
      - extendedWaitUntil:
          visible: "Leave this device"
          timeout: 15000
      - tapOn: "Leave this device"
      - extendedWaitUntil:
          visible: 'Leave this device\?'
          timeout: 5000
      - tapOn:
          text: "Sign out"
          below: "Make sure your recent care logs are synced before switching accounts."
      - extendedWaitUntil:
          visible: "Because caring is a lot to remember"
          timeout: 15000
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 10000
- tapOn: 'Forgot password\?'
- extendedWaitUntil:
    visible: 'Forgot your password\?'
    timeout: 10000
- tapOn: "you@example.com"
- inputText: ${RESET_EMAIL}
- hideKeyboard
- tapOn: "Send reset link"
- extendedWaitUntil:
    visible: "If ${RESET_EMAIL} has an account, a reset link is on its way."
    timeout: 15000
- assertVisible: "Check your inbox"
- assertVisible: "Send again"
- assertVisible: "Back to sign in"
- takeScreenshot: evidence/FR-21
