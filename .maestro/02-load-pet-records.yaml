appId: com.anonymous.smartpetcareapp
name: Load pet records
env:
  PET_NAME: Rex
---
- launchApp
- tapOn: "Pets"
- tapOn: "View ${PET_NAME}"
- extendedWaitUntil:
    visible:
      text: "Overview"
    timeout: 15000
- tapOn: "Health"
- extendedWaitUntil:
    visible:
      text: "Health"
    timeout: 15000
- tapOn: "Reminders"
- extendedWaitUntil:
    visible:
      text: "Reminders"
    timeout: 15000
# "Back" alone also matches the system navigation bar button.
- tapOn:
    text: "Back"
    above: "Overview"
