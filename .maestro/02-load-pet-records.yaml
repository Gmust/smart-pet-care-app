appId: com.misopets.app
name: Load pet records
env:
  # A plain constant here would override `-e PET_NAME=...`; this form only defaults.
  PET_NAME: ${PET_NAME || "Rex"}
---
- launchApp
- runFlow: subflows/open-pet-profile.yaml
- extendedWaitUntil:
    visible:
      text: "Overview"
    timeout: 15000
- tapOn: "Health"
- extendedWaitUntil:
    visible:
      text: "Health"
    timeout: 15000
- assertVisible: "Vet visits"
